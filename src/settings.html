<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WappLink - contas e tela</title>
<style>
  /* mesma familia visual do WhatsApp: fundo da coluna, tinta preta/branca em
     transparencia, um acento so (o verde do WhatsApp) */
  :root {
    --bg: rgb(247, 245, 243);
    --panel: #fff;
    --ink: 0, 0, 0;
    --accent: #1daa61;
  }
  :root.dark { --ink: 255, 255, 255; --panel: rgba(255, 255, 255, .04); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: rgba(var(--ink), .87);
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(var(--ink), .12);
  }
  button, input { font: inherit; color: inherit; }

  header {
    -webkit-app-region: drag;
    display: flex; align-items: center;
    padding: 14px 12px 10px 18px;
  }
  header .t { font-size: 15px; font-weight: 600; }
  header button {
    -webkit-app-region: no-drag;
    margin-left: auto;
    width: 28px; height: 28px;
    border: 0; border-radius: 50%;
    background: transparent;
    color: rgba(var(--ink), .6);
    display: grid; place-items: center;
    cursor: pointer;
  }
  header button:hover { background: rgba(var(--ink), .06); }

  main { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: rgba(var(--ink), .15); border-radius: 3px; }

  h2 {
    font-size: 12px; font-weight: 500;
    color: rgba(var(--ink), .55);
    margin: 14px 6px 8px;
  }

  .card {
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid rgba(var(--ink), .06);
  }

  /* ------------------------------------------------------ modos de tela */
  .modes { display: flex; padding: 4px; gap: 4px; }
  .mode {
    flex: 1;
    border: 0; border-radius: 9px;
    background: transparent;
    color: rgba(var(--ink), .6);
    padding: 9px 4px 7px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px;
  }
  .mode:hover { background: rgba(var(--ink), .04); }
  .mode.on { background: rgba(var(--ink), .08); color: rgba(var(--ink), .9); }
  .mode svg rect { fill: none; stroke: currentColor; stroke-width: 1.4; }
  .mode.on svg rect { fill: currentColor; fill-opacity: .12; }
  .hint { color: rgba(var(--ink), .5); font-size: 12px; margin: 8px 6px 0; line-height: 1.55; }

  /* ------------------------------------------------------ contas */
  .acc { border-radius: 10px; }
  .acc + .acc { border-top: 1px solid rgba(var(--ink), .06); }
  .acc.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .acc.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .acc.dragging { opacity: .4; }

  .row { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 6px; }
  .num {
    width: 14px; flex: 0 0 14px;
    text-align: center;
    font-size: 11px; font-variant-numeric: tabular-nums;
    color: rgba(var(--ink), .35);
    cursor: grab;
  }
  .pic {
    width: 32px; height: 32px; flex: 0 0 32px;
    border-radius: 50%;
    background: center/cover no-repeat;
    display: grid; place-items: center;
    font-size: 11.5px; font-weight: 600; letter-spacing: .3px;
    color: #fff;
    cursor: pointer;
  }
  .pic.has span { display: none; }
  .pic:hover { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px rgba(var(--ink), .25); }
  .name {
    flex: 1; min-width: 0;
    background: transparent; border: 0;
    border-radius: 6px;
    font-size: 13.5px; font-weight: 500;
    padding: 4px 6px; margin-left: -6px;
    outline: none;
    -webkit-user-select: text;
  }
  .name:hover { background: rgba(var(--ink), .04); }
  .name:focus { background: rgba(var(--ink), .06); }

  .icon {
    width: 30px; height: 30px; flex: 0 0 30px;
    border: 0; border-radius: 50%;
    background: transparent;
    color: rgba(var(--ink), .45);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon:hover { background: rgba(var(--ink), .06); color: rgba(var(--ink), .8); }
  .icon.on { color: var(--accent); }

  .more { display: none; padding: 0 12px 12px 58px; }
  .acc.open .more { display: block; }
  .swatches { display: flex; gap: 8px; margin: 2px 0 12px; }
  .sw {
    width: 16px; height: 16px; border-radius: 50%;
    cursor: pointer;
  }
  .sw.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px currentColor; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts button {
    border: 1px solid rgba(var(--ink), .12);
    background: transparent;
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 12px;
    color: rgba(var(--ink), .75);
    cursor: pointer;
  }
  .acts button:hover { background: rgba(var(--ink), .05); }
  .acts button.danger { color: #d1485a; }

  #add {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    border: 0; border-top: 1px solid rgba(var(--ink), .06);
    border-radius: 0 0 12px 12px;
    background: transparent;
    color: var(--accent);
    padding: 10px 8px 10px 30px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    text-align: left;
  }
  #add:hover:not(:disabled) { background: rgba(var(--ink), .03); }
  #add:disabled { color: rgba(var(--ink), .4); cursor: default; }
  #add .plus {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(29, 170, 97, .12);
  }
  #add:disabled .plus { background: rgba(var(--ink), .06); }

  /* ------------------------------------------------------ opcoes */
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .opt + .opt { border-top: 1px solid rgba(var(--ink), .06); }
  .opt span { flex: 1; }
  /* chave no lugar do checkbox */
  .opt input {
    appearance: none;
    width: 34px; height: 20px; flex: 0 0 34px;
    border-radius: 10px;
    background: rgba(var(--ink), .18);
    position: relative;
    cursor: pointer;
    transition: background-color .15s ease;
  }
  .opt input::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: transform .15s ease;
  }
  .opt input:checked { background: var(--accent); }
  .opt input:checked::after { transform: translateX(14px); }

  footer {
    padding: 10px 18px 14px;
    color: rgba(var(--ink), .45);
    font-size: 11.5px;
    line-height: 1.9;
  }
  footer kbd {
    font: 11px "Segoe UI", -apple-system, system-ui, sans-serif;
    color: rgba(var(--ink), .7);
    background: rgba(var(--ink), .06);
    border-radius: 4px;
    padding: 1px 5px;
  }
</style>
</head>
<body>

<header>
  <span class="t">Contas e tela</span>
  <button id="x" title="Fechar (Esc)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</header>

<main>
  <div class="card modes">
    <button class="mode" data-mode="focus">
      <svg width="30" height="20" viewBox="0 0 30 20"><rect x="1" y="1" width="28" height="18" rx="3"/></svg>
      Uma conta
    </button>
    <button class="mode" data-mode="cols">
      <svg width="30" height="20" viewBox="0 0 30 20"><rect x="1" y="1" width="13" height="18" rx="3"/><rect x="16" y="1" width="13" height="18" rx="3"/></svg>
      Colunas
    </button>
    <button class="mode" data-mode="rows">
      <svg width="30" height="20" viewBox="0 0 30 20"><rect x="1" y="1" width="28" height="8" rx="3"/><rect x="1" y="11" width="28" height="8" rx="3"/></svg>
      Linhas
    </button>
  </div>
  <div class="hint" id="modehint"></div>

  <h2>Contas</h2>
  <div class="card">
    <div id="list"></div>
    <button id="add"><span class="plus"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span id="addlabel">Adicionar conta</span></button>
  </div>

  <h2>Opções</h2>
  <div class="card">
    <label class="opt"><span>Painel estreito mostra só a lista</span><input type="checkbox" id="listonly"></label>
    <label class="opt"><span>Fechar minimiza para a bandeja</span><input type="checkbox" id="tray"></label>
  </div>
</main>

<footer>
  <div><kbd class="mod">Ctrl</kbd> <kbd>1</kbd>…<kbd>9</kbd> troca de conta · <kbd class="mod">Ctrl</kbd> <kbd>D</kbd> divide a tela</div>
</footer>

<script>
  let state = { accounts: [], layout: { mode: 'focus', panes: [] }, palette: [], maxAccounts: 8, closeToTray: true }
  let openId = null
  let dragId = null

  const $list = document.getElementById('list')
  const $hint = document.getElementById('modehint')

  const initials = (name) => {
    const parts = String(name || '?').trim().split(/\s+/)
    return (parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2)).toUpperCase()
  }

  const HINTS = {
    focus: 'Uma conta por vez. As contas ficam na coluna de ícones do WhatsApp, embaixo do Meta AI.',
    cols: 'Contas lado a lado. Ctrl+clique numa conta põe ou tira da tela; arraste a divisória pra mudar a proporção.',
    rows: 'Contas empilhadas. Ctrl+clique numa conta põe ou tira da tela; arraste a divisória pra mudar a proporção.'
  }

  function renderModes () {
    document.querySelectorAll('.mode').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.mode === state.layout.mode)
      btn.onclick = () => zap.mode(btn.dataset.mode)
    })
    let hint = HINTS[state.layout.mode] || ''
    if (state.platform === 'darwin') hint = hint.replace('Ctrl+', '⌘+')
    $hint.textContent = hint
  }

  function renderList () {
    $list.innerHTML = ''
    state.accounts.forEach((acc, index) => {
      const box = document.createElement('div')
      box.className = 'acc' + (openId === acc.id ? ' open' : '')
      box.draggable = true
      box.dataset.id = acc.id
      box.dataset.index = index

      // ------------------------------------------------ linha principal
      const row = document.createElement('div')
      row.className = 'row'

      // a posicao na coluna do WhatsApp; arrastar a linha reordena
      const num = document.createElement('span')
      num.className = 'num'
      num.textContent = index + 1
      num.title = 'Arraste pra reordenar'
      row.appendChild(num)

      const pic = document.createElement('div')
      pic.className = 'pic' + (acc.avatar ? ' has' : '')
      pic.title = acc.avatar ? 'Trocar a foto' : 'Escolher uma foto'
      if (acc.avatar) pic.style.backgroundImage = 'url(' + acc.avatar + ')'
      else pic.style.backgroundColor = acc.color
      pic.innerHTML = '<span>' + initials(acc.name) + '</span>'
      pic.onclick = () => zap.avatar(acc.id)
      row.appendChild(pic)

      const name = document.createElement('input')
      name.className = 'name'
      name.value = acc.name
      name.maxLength = 24
      name.spellcheck = false
      name.onkeydown = (e) => { if (e.key === 'Enter') name.blur() }
      name.onblur = () => {
        const v = name.value.trim()
        if (!v) { name.value = acc.name; return }
        if (v !== acc.name) zap.rename(acc.id, v)
      }
      row.appendChild(name)

      const onScreen = document.createElement('button')
      onScreen.className = 'icon' + (acc.onScreen ? ' on' : '')
      onScreen.title = acc.onScreen ? 'Está na tela — clique pra tirar' : 'Pôr na tela'
      onScreen.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">' +
        '<rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8.5 20.5h7" stroke-linecap="round"/></svg>'
      onScreen.onclick = () => zap.togglePane(acc.id)
      row.appendChild(onScreen)

      const chev = document.createElement('button')
      chev.className = 'icon'
      chev.title = 'Mais opções'
      chev.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M6 9l6 6 6-6"/></svg>'
      chev.style.transform = openId === acc.id ? 'rotate(180deg)' : ''
      chev.onclick = () => { openId = openId === acc.id ? null : acc.id; renderList() }
      row.appendChild(chev)

      box.appendChild(row)

      // ------------------------------------------------ area expandida
      const more = document.createElement('div')
      more.className = 'more'

      const sw = document.createElement('div')
      sw.className = 'swatches'
      state.palette.forEach(color => {
        const dot = document.createElement('div')
        dot.className = 'sw' + (color.toLowerCase() === String(acc.color).toLowerCase() ? ' on' : '')
        dot.style.background = color
        dot.style.color = color
        dot.onclick = () => zap.color(acc.id, color)
        sw.appendChild(dot)
      })
      more.appendChild(sw)

      const acts = document.createElement('div')
      acts.className = 'acts'
      const mk = (label, fn, danger) => {
        const b = document.createElement('button')
        b.textContent = label
        if (danger) b.className = 'danger'
        b.onclick = fn
        return b
      }
      acts.appendChild(mk('Recarregar', () => zap.reload(acc.id)))
      if (acc.avatar) acts.appendChild(mk('Tirar foto', () => zap.avatarClear(acc.id)))
      acts.appendChild(mk('Desconectar', () => zap.logout(acc.id), true))
      if (state.accounts.length > 1) acts.appendChild(mk('Remover conta', () => zap.remove(acc.id), true))
      more.appendChild(acts)

      box.appendChild(more)

      // ------------------------------------------------ reordenar
      box.ondragstart = (e) => {
        dragId = acc.id
        box.classList.add('dragging')
        e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', acc.id)
      }
      box.ondragend = () => {
        dragId = null
        document.querySelectorAll('.acc').forEach(el => el.classList.remove('dragging', 'drop-before', 'drop-after'))
      }
      box.ondragover = (e) => {
        if (!dragId || dragId === acc.id) return
        e.preventDefault()
        const after = e.offsetY > box.offsetHeight / 2
        document.querySelectorAll('.acc').forEach(el => el.classList.remove('drop-before', 'drop-after'))
        box.classList.add(after ? 'drop-after' : 'drop-before')
      }
      box.ondrop = (e) => {
        if (!dragId || dragId === acc.id) return
        e.preventDefault()
        const from = state.accounts.findIndex(a => a.id === dragId)
        const after = e.offsetY > box.offsetHeight / 2
        let target = after ? index + 1 : index
        if (from < target) target -= 1
        zap.reorder(dragId, target)
      }

      $list.appendChild(box)
    })

    const add = document.getElementById('add')
    add.disabled = state.accounts.length >= state.maxAccounts
    document.getElementById('addlabel').textContent = add.disabled
      ? 'Limite de ' + state.maxAccounts + ' contas'
      : 'Adicionar conta'
  }

  document.getElementById('add').onclick = () => zap.add()
  document.getElementById('x').onclick = () => zap.close()
  document.getElementById('tray').onchange = (e) => zap.closeToTray(e.target.checked)
  document.getElementById('listonly').onchange = (e) => zap.listOnly(e.target.checked)
  addEventListener('keydown', (e) => { if (e.key === 'Escape') zap.close() })

  zap.onState((s) => {
    state = s
    if (openId && !s.accounts.some(a => a.id === openId)) openId = null
    if (s.theme) {
      document.documentElement.style.setProperty('--bg', s.theme.bg)
      document.documentElement.classList.toggle('dark', !!s.theme.dark)
    }
    if (s.platform === 'darwin') document.querySelectorAll('kbd.mod').forEach(k => { k.textContent = '⌘' })
    document.getElementById('tray').checked = !!s.closeToTray
    document.getElementById('listonly').checked = !!s.listOnly
    renderModes()
    renderList()
  })

  zap.ready()
</script>
</body>
</html>
