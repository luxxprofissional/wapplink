<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WappLink</title>
<style>
  /* a pagina so aparece na barra de titulo e nas divisorias; o resto da janela
     e coberto pelas contas. As cores vem da coluna do WhatsApp da conta focada. */
  :root {
    --bg: rgb(247, 245, 243);
    --ink: 0, 0, 0;
  }
  :root.dark { --ink: 255, 255, 255; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: rgba(var(--ink), .6);
    font: 12px/1 "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select: none;
  }

  /* ---------------------------------------------------------- barra de titulo */
  #bar {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 32px;
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: center;
  }
  #title {
    max-width: 50%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500;
    letter-spacing: .1px;
  }
  #title .dim { opacity: .55; font-weight: 400; }

  /* ---------------------------------------------------------- divisorias */
  /* so a folga entre os paineis chega ate aqui: o resto e WhatsApp */
  .gutter { position: absolute; }
  .gutter::after {
    content: "";
    position: absolute;
    background: rgba(var(--ink), .1);
    transition: background-color .12s ease;
  }
  .gutter:hover::after, .gutter.dragging::after { background: rgba(var(--ink), .28); }
  .gutter.cols { cursor: col-resize; }
  .gutter.rows { cursor: row-resize; }
  .gutter.cols::after { left: 50%; width: 1px; top: 0; bottom: 0; }
  .gutter.rows::after { top: 50%; height: 1px; left: 0; right: 0; }
</style>
</head>
<body>

<div id="bar"><span id="title">WappLink</span></div>

<script>
  const $title = document.getElementById('title')

  function renderTitle (state) {
    const acc = state.accounts.find(a => a.active)
    $title.textContent = ''
    if (!acc) { $title.textContent = 'WappLink'; return }
    $title.append(acc.name)
    const dim = document.createElement('span')
    dim.className = 'dim'
    dim.textContent = '  —  WappLink'
    $title.append(dim)
  }

  function renderTheme (theme) {
    if (!theme) return
    document.documentElement.style.setProperty('--bg', theme.bg)
    document.documentElement.classList.toggle('dark', !!theme.dark)
  }

  function renderGutters (gutters) {
    document.querySelectorAll('.gutter').forEach(el => el.remove())
    gutters.forEach(g => {
      const el = document.createElement('div')
      el.className = 'gutter ' + g.dir
      el.style.left = g.x + 'px'
      el.style.top = g.y + 'px'
      el.style.width = g.width + 'px'
      el.style.height = g.height + 'px'
      el.onmousedown = (e) => {
        if (e.button !== 0) return
        e.preventDefault()
        el.classList.add('dragging')
        zap.gutterDown(g.index)
      }
      document.body.appendChild(el)
    })
  }

  zap.onState((state) => { renderTheme(state.theme); renderTitle(state) })
  zap.onGutters(renderGutters)

  zap.ready()
</script>
</body>
</html>
